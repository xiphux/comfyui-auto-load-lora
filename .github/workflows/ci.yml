# CI: lint, tests, and a security lint of the workflows themselves.
#
# Triggers:
#   - Pushes to `main`, so direct commits there are checked.
#   - Every pull request (including Renovate's), which drives the PR checks
#     that branch protection requires before auto-merge.
# Pushes to other branches don't run on their own: a branch with a PR is
# checked by the `pull_request` run, which tests the merge result.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

# Every job sets `timeout-minutes`, a few times its normal duration: GitHub's
# default is 6 hours, which is how long a hang would otherwise hold a runner
# (and a Renovate PR's verdict).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # --locked, not --frozen: fail if uv.lock no longer matches
      # pyproject.toml, so a hand edit committed without `uv lock` is caught.
      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run --frozen ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run --frozen ruff format --check .

      # The frontend has no test suite; at least catch syntax errors. Copied to
      # .mjs so Node parses it as an ES module regardless of its version.
      - name: JavaScript syntax
        if: ${{ !cancelled() }}
        run: |
          cp src/web/auto_lora.js "$RUNNER_TEMP/auto_lora.mjs"
          node --check "$RUNNER_TEMP/auto_lora.mjs"

  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest version requires-python allows, and the newest.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run --frozen pytest -v

  # A stable check name for "did the test matrix pass?", which is what a required
  # status check needs and what `tests` cannot provide. GitHub names a matrix
  # job's check runs after its values -- `pytest (Python 3.10)`, and so on --
  # while a required check names one fixed string in the repository settings,
  # where nothing links it to this file. So the day the matrix changes, the old
  # names stop being reported and the required check waits for them forever.
  # Requiring `Tests` instead leaves the matrix free to move.
  #
  # It is not a second opinion on the tests: it reads `needs.tests.result` and
  # nothing else, and fails closed on anything but `success`. `always()` rather
  # than `!cancelled()`: GitHub counts a SKIPPED required check as passing, so
  # this must always run and report, even when the matrix was cancelled.
  test-result:
    name: Tests
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Python version passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          echo "tests: ${RESULT}"
          test "${RESULT}" = "success"

  # Named for the check branch protection requires, which predates actionlint
  # joining zizmor here; renaming it means updating the required check too.
  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Correctness, where zizmor is security: expression and type errors, a
      # `needs` naming no job, and shellcheck over every `run:` script (with the
      # runner image's preinstalled shellcheck). The release binary from GitHub,
      # checksum-pinned, rather than the Docker Hub image, whose anonymous pulls
      # are rate-limited per IP on shared runners. Bump the version and checksum
      # together, from the release's checksums.txt.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Online audits use the job's read-only token to verify that each SHA pin
      # is a real commit of the named repo and matches its `# vX.Y.Z` comment.
      # Annotations instead of SARIF upload: no `security-events: write` needed.
      # `version` must be one the pinned action release knows; bump them together.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
